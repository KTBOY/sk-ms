    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        /* ── Ken Burns: the slowest beat of the film — left region → center → right-down, then hold ── */
        const world = document.querySelector(".f05-graph-world");
        tl.fromTo(world,
          { x: 130, y: 62, scale: 1.26 },
          { x: 0, y: 0, scale: 1.20, duration: 5.0, ease: "sine.inOut" }, 0);
        tl.to(world,
          { x: -118, y: -64, scale: 1.17, duration: 2.5, ease: "sine.inOut" }, 5.0);
        /* 7.5–9.0s: camera still — 尾段持读 */

        /* ── Scene 1 (0.0–2.5s): surface establishes, header reveals ── */
        const stage = document.querySelector(".f05-graph-stage");
        tl.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);

        const header = document.querySelector(".f05-graph-header");
        tl.fromTo(header, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.3);
        tl.fromTo("[data-rule]", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 0.6);

        /* ── Scene 2 (2.5–5.0s): 关系网络 + gold node glows breathe ── */
        const view0 = document.querySelector('[data-view="0"]');
        tl.fromTo(view0, { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 2.5);

        const glows = {
          main: document.querySelector('[data-glow="main"]'),
          a: document.querySelector('[data-glow="a"]'),
          b: document.querySelector('[data-glow="b"]'),
          c: document.querySelector('[data-glow="c"]')
        };

        function breathe(el, popAt, pops) {
          tl.fromTo(el,
            { opacity: 0, scale: 0.4 },
            { opacity: 0.95, scale: 1, duration: 0.55, ease: "power2.out" }, popAt);
          let t = popAt + 0.55;
          pops.forEach(function (o) {
            tl.to(el, { opacity: o, duration: 0.75, ease: "sine.inOut" }, t);
            t += 0.75;
          });
        }

        breathe(glows.main, 2.6, [0.55, 0.95, 0.6, 1.0]);
        breathe(glows.a, 3.3, [0.6, 0.9, 0.55]);
        breathe(glows.b, 4.0, [0.6, 0.95, 0.55]);
        breathe(glows.c, 5.4, [0.55, 0.85, 0.5]);

        /* top-right tag 01: 关系网络 */
        const tag0 = document.querySelector('[data-tag="0"]');
        tl.fromTo(tag0, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.8);
        tl.to(tag0, { opacity: 0, duration: 0.6, ease: "power1.in" }, 4.4);

        /* ── Scene 3 (5.0–9.0s): 事件因果 → 人物轨迹, tags bloom and fade, camera settles ── */
        const view1 = document.querySelector('[data-view="1"]');
        tl.fromTo(view1, { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 5.0);
