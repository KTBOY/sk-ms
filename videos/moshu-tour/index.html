<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #14161A;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="65"
      data-width="1920"
      data-height="1080"
    >
      <audio
        id="bgm-main"
        src="assets/bgm.m4a"
        data-start="0"
        data-duration="65"
        data-volume="0.55"
      ></audio>
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-pain"
        class="scene"
        data-composition-id="02-pain"
        data-composition-src="compositions/frames/02-pain.html"
        data-start="7"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-dashboard"
        class="scene"
        data-composition-id="03-dashboard"
        data-composition-src="compositions/frames/03-dashboard.html"
        data-start="14"
        data-duration="9"
        data-track-index="0"
      ></div>

      <div
        id="el-04-writing"
        class="scene"
        data-composition-id="04-writing"
        data-composition-src="compositions/frames/04-writing.html"
        data-start="23"
        data-duration="9.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-graph"
        class="scene"
        data-composition-id="05-graph"
        data-composition-src="compositions/frames/05-graph.html"
        data-start="32"
        data-duration="9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-characters"
        class="scene"
        data-composition-id="06-characters"
        data-composition-src="compositions/frames/06-characters.html"
        data-start="41"
        data-duration="8.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-export"
        class="scene"
        data-composition-id="07-export"
        data-composition-src="compositions/frames/07-export.html"
        data-start="49"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="57"
        data-duration="8"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-02-pain", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-02-pain", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.fromTo("#el-03-dashboard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.to("#el-04-writing", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 32);
        tl.fromTo("#el-05-graph", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 32);
        tl.to("#el-06-characters", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 49);
        tl.fromTo("#el-07-export", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 49);
        tl.to("#el-07-export", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 57);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 57);
        tl.to({}, { duration: 65 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
