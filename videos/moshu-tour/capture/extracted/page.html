<style type="text/css" data-vite-dev-id="E:/work/gogogogo/sk-ms-main/src/styles/tokens.css">/* ============================================================
   墨枢 NovelAtlas · 设计 Tokens（唯一事实源）
   设计语言：Resonance HUD —— 深色金调游戏 HUD（.agents/skills/resonance-hud）
   品牌金取样自已上线产品，色相不可改；旧玻璃拟态令牌名全部
   重定向到 HUD 值，保证残留引用不再泄漏紫色。
   ============================================================ */
:root {
  /* ===== Resonance HUD 核心令牌（不可改色相） ===== */
  --gold:        #c9ac67;
  --gold-bright: #e6cf95;
  --gold-dim:    rgba(201, 172, 103, 0.3);

  --cream:     #fafae9;
  --cream-dim: rgba(250, 250, 233, 0.45);

  --bg-0: #14161a;
  --bg-1: #1b1e23;
  --card: rgba(255, 255, 255, 0.035);
  --hair: rgba(201, 172, 103, 0.2);

  --hud-ease: cubic-bezier(0.32, 0.72, 0.24, 1);
  --hud-latin: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;

  /* ===== 旧令牌名 → HUD 值（重定向层，勿删除） ===== */
  --bg-outer: #0c0d10;
  --panel-grad: linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);

  --glass: var(--card);                              /* 卡片填充 */
  --glass-strong: rgba(201, 172, 103, 0.08);         /* 悬停提亮 */
  --glass-dark: rgba(20, 22, 26, 0.92);              /* 弹层底 */
  --glass-line: var(--hair);                         /* 发丝描边 */
  --glass-line-hi: var(--gold-dim);

  --text-hi: var(--cream);
  --text-mid: rgba(250, 250, 233, 0.72);
  --text-dim: var(--cream-dim);

  /* 强调色：唯一色相 = 金。--ok 为运行状态绿色（skill 允许的唯一例外） */
  --accent: var(--gold);
  --accent-2: var(--gold-bright);
  --ok: #6ee7a0;
  --danger: #ff6b6b;

  /* 实体内容色（数据编码，允许保留；通过 --tag-c / --c / --theme 注入内容表面） */
  --entity-char: #c9a6ff;
  --entity-loc: #6fe3d0;
  --entity-item: #ffd37a;
  --entity-event: #ff9e7a;
  --entity-faction: #7fb0ff;
  --theme: #d9b45c;

  /* 几何：纯直角，零圆角 */
  --radius-panel: 0px;
  --radius-card: 0px;
  --radius-sm: 0px;
  --radius-pill: 0px;

  /* 阴影：近黑深投影 */
  --shadow-card: 0 14px 34px rgba(0, 0, 0, 0.45);
  --shadow-pop: 0 20px 60px rgba(0, 0, 0, 0.6);

  /* 字体 */
  --font: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;

  /* 兼容别名（历史引用） */
  --hud-gold: var(--gold);
  --hud-gold-bright: var(--gold-bright);
  --hud-gold-dim: var(--gold-dim);
  --hud-cream: var(--cream);
  --hud-cream-dim: var(--cream-dim);
  --hud-bg-0: var(--bg-0);
  --hud-bg-1: var(--bg-1);
  --hud-card: var(--card);
  --hud-hair: var(--hair);
}
</style>
<style type="text/css" data-vite-dev-id="E:/work/gogogogo/sk-ms-main/src/styles/base.css">/* ============================================================
   基础：重置 + 全局壳层（Resonance HUD：近黑基底 + 金调面板 + 顶栏）
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }

/* 残留原生控件（复选框等）一律按深色渲染 */
:root { color-scheme: dark; }

body {
  font-family: var(--font);
  background: var(--bg-outer);
  background-image:
    radial-gradient(1100px 520px at 88% -12%, rgba(201, 172, 103, 0.09), transparent 62%),
    radial-gradient(900px 520px at -8% 112%, rgba(201, 172, 103, 0.05), transparent 60%);
  color: var(--text-hi);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
}

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
input, select, textarea { font-family: inherit; }
ul, ol { list-style: none; }
a { color: inherit; }
code.contract {
  display: inline-block; margin: 4px 6px 0; padding: 2px 8px;
  background: rgba(0, 0, 0, 0.35); font-size: 12px; color: var(--gold-bright);
}
.dim { color: var(--text-dim); font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(201, 172, 103, 0.28); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------- 通用 HUD 微件 ---------------- */
/* 菱形节点：替代所有圆点 */
.diamond {
  display: inline-block; width: 9px; height: 9px; flex: none;
  background: var(--gold); transform: rotate(45deg);
  box-shadow: 0 0 8px rgba(201, 172, 103, 0.7);
}
/* 点阵括号：2×3 点阵，成对夹住文字（.mirror 镜像） */
.dots {
  display: inline-grid; flex: none;
  grid-template-columns: 2px 2px; grid-template-rows: 2px 2px 2px;
  gap: 1.5px; opacity: 0.55;
}
.dots i { background: var(--gold); }
.dots.mirror { transform: scaleX(-1); }
/* 区块标题拉丁副标 */
.head-en {
  font: 400 8.5px/1 var(--hud-latin);
  letter-spacing: 2.2px; color: var(--gold-dim);
  text-transform: uppercase; white-space: nowrap;
}

/* ---------------- 应用壳层 ---------------- */
.app-shell {
  height: 100%;
  padding: 22px;
  display: flex;
}

/* 主面板：HUD 面板基底 —— 偏心辉光 + 顶部发丝金线 + 扫描纹理，纯直角 */
.app-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 1px solid var(--hair);
  background:
    radial-gradient(130% 80% at 100% 0%, rgba(201, 172, 103, 0.11), transparent 62%),
    linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}
.app-panel::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.022) 0 1px, transparent 1px 5px);
  pointer-events: none;
  z-index: 0;
}
.app-panel::after {
  content: '';
  position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, var(--gold), rgba(201, 172, 103, 0.35));
  pointer-events: none; z-index: 3;
}
.app-panel > * { position: relative; z-index: 1; }
.app-panel--loading { align-items: center; justify-content: center; }

.boot { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.boot__mark {
  width: 14px; height: 14px;
  background: var(--gold); transform: rotate(45deg);
  box-shadow: 0 0 22px rgba(201, 172, 103, 0.75);
  margin-bottom: 6px;
}
.boot b { font-size: 17px; font-weight: 600; letter-spacing: 6px; color: var(--cream); }
.boot .boot__en {
  font: 400 9px/1 var(--hud-latin); letter-spacing: 3.5px;
  color: var(--gold-dim); text-transform: uppercase;
}
.boot span { font-size: 12px; color: var(--cream-dim); }

/* 顶栏：菱形标记双语 Logo ｜ 方格图标导航 ｜ 搜索 + 头像 */
.app-topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 16px 24px 12px;
  border-bottom: 1px solid rgba(201, 172, 103, 0.12);
  /* 顶栏排在 main 之前，需更高层级，搜索下拉才不会被页面内容（如 hero2）盖住 */
  position: relative;
  z-index: 5;
}
.app-logo { display: flex; align-items: center; gap: 11px; }
.app-logo__mark {
  width: 12px; height: 12px; flex: none;
  background: var(--gold); transform: rotate(45deg);
  box-shadow: 0 0 14px rgba(201, 172, 103, 0.7);
}
.app-logo__text { display: flex; flex-direction: column; gap: 3px; text-align: left; }
.app-logo__text b { font-size: 14px; font-weight: 600; letter-spacing: 4px; color: var(--cream); line-height: 1; }
.app-logo__text i {
  font: 400 8px/1 var(--hud-latin); font-style: normal;
  letter-spacing: 2.6px; color: var(--gold-dim); text-transform: uppercase;
}

.app-nav {
  flex: 1;
  display: flex;
  justify-content: center;
  gap: 2px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--hair);
  padding: 4px;
  width: fit-content;
  margin: 0 auto;
}
.app-nav__btn {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 38px;
  color: var(--cream-dim);
  border: 1px solid transparent;
  transition: all 0.16s var(--hud-ease);
}
.app-nav__btn:hover { background: rgba(201, 172, 103, 0.08); color: var(--gold-bright); }
.app-nav__btn.is-active {
  background: var(--gold); color: #14161a;
  box-shadow: 0 0 14px rgba(201, 172, 103, 0.35);
}

.app-topbar__right { display: flex; align-items: center; gap: 14px; }

.app-search { position: relative; display: flex; align-items: center; gap: 8px; }
.app-search > svg { position: absolute; left: 13px; color: var(--gold-dim); pointer-events: none; }
.app-search .ui-input {
  padding-left: 34px; width: 240px; height: 36px;
  background: rgba(255, 255, 255, 0.035);
}
.app-search > button { position: absolute; right: 12px; color: var(--cream-dim); display: flex; }
.app-search__pop {
  position: absolute; top: calc(100% + 8px); right: 0; width: 280px; z-index: 60;
  background: rgba(20, 22, 26, 0.97);
  border: 1px solid var(--hair);
  box-shadow: var(--shadow-pop); overflow: hidden; padding: 6px;
}
.app-search__pop button {
  width: 100%; text-align: left; padding: 8px 10px;
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
.app-search__pop button:hover { background: rgba(201, 172, 103, 0.09); }
.app-search__pop b { color: var(--cream); font-weight: 600; }

.app-avatar { position: relative; display: flex; }
.app-avatar .avatar {
  border-radius: 0 !important;
  border: 1px solid var(--gold-dim) !important;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
}
.app-avatar__fallback {
  width: 42px; height: 42px;
  background: rgba(201, 172, 103, 0.14); color: var(--gold-bright);
  border: 1px solid var(--gold-dim);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px;
}
.app-avatar i {
  position: absolute; top: -6px; right: -6px;
  background: var(--gold); color: #14161a; font-style: normal;
  font-size: 10px; line-height: 1; padding: 3px 5px; font-weight: 700;
  box-shadow: 0 0 10px rgba(201, 172, 103, 0.5);
}

/* 内容区 */
.app-content { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 28px 20px; animation: fade-in 0.14s ease-out; }
.app-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 28px 12px; font-size: 12px; color: var(--cream-dim);
  border-top: 1px solid rgba(201, 172, 103, 0.1);
}
.app-foot__right { display: inline-flex; align-items: center; gap: 14px; }
.app-foot__right em {
  font-style: normal; display: inline-flex; align-items: center; gap: 9px;
  font: 400 8.5px/1 var(--hud-latin); letter-spacing: 2px;
  color: var(--cream-dim); text-transform: uppercase;
}
.app-foot__right em::before, .app-foot__right em::after {
  content: ''; width: 5.5px; height: 9px; opacity: 0.55;
  background-image:
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold));
  background-size: 2px 2px;
  background-repeat: no-repeat;
  background-position: 0 0, 3.5px 0, 0 3.5px, 3.5px 3.5px, 0 7px, 3.5px 7px;
}
.app-foot__right em::after { transform: scaleX(-1); }

@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
<style type="text/css" data-vite-dev-id="E:/work/gogogogo/sk-ms-main/src/styles/components.css">/* ============================================================
   组件库样式（Resonance HUD）：按钮/输入/面板/弹窗/Toast/标签/
   头像/联想选择器 —— 近黑底、金发丝边、纯直角、菱形节点
   ============================================================ */

/* ---------------- 按钮 ---------------- */
.ui-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--hair);
  color: var(--cream);
  font-size: 13px;
  transition: all 0.16s var(--hud-ease);
  white-space: nowrap;
}
.ui-btn:hover:not(:disabled) { background: rgba(201, 172, 103, 0.08); border-color: var(--gold-dim); color: var(--gold-bright); }
.ui-btn--sm { height: 28px; padding: 0 12px; font-size: 12px; }
.ui-btn--primary {
  background: var(--gold); border-color: var(--gold); color: #14161a; font-weight: 600;
  /* 切角：金底实心自成边缘（skill 认可的安全切角） */
  clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
}
.ui-btn--primary:hover:not(:disabled) { background: var(--gold-bright); border-color: var(--gold-bright); color: #14161a; }
.ui-btn--danger { background: rgba(255, 107, 107, 0.07); border-color: rgba(255, 107, 107, 0.4); color: #ff9c9c; }
.ui-btn--danger:hover:not(:disabled) { background: rgba(255, 107, 107, 0.16); border-color: var(--danger); color: #ffb3b3; }
.ui-btn--ghost { background: transparent; border-color: transparent; color: var(--cream-dim); }
.ui-btn--ghost:hover:not(:disabled) { background: rgba(201, 172, 103, 0.08); color: var(--gold-bright); }

.ui-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; color: var(--cream-dim);
}
.ui-iconbtn:hover { background: rgba(201, 172, 103, 0.1); color: var(--gold-bright); }

/* ---------------- 输入 ---------------- */
.ui-input {
  height: 36px; width: 100%;
  padding: 0 12px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--hair);
  color: var(--cream);
  font-size: 13px;
  outline: none;
  transition: border 0.15s, box-shadow 0.15s;
}
.ui-input::placeholder { color: var(--cream-dim); }
.ui-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 1px rgba(201, 172, 103, 0.22); }
.ui-textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.7; }

/* ---------------- 下拉框：自绘弹层（近黑底 / 金色选中 / 菱形标记） ---------------- */
.ui-select-root { position: relative; width: 100%; }
.ui-select__trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; height: 36px; padding: 0 10px 0 12px;
  text-align: left;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--hair);
  color: var(--cream); font-size: 13px;
  transition: border 0.15s, box-shadow 0.15s;
}
.ui-select__trigger:hover:not(:disabled) { border-color: var(--gold-dim); }
.ui-select__trigger:focus { outline: none; border-color: var(--gold-dim); box-shadow: 0 0 0 1px rgba(201, 172, 103, 0.22); }
.ui-select__trigger:disabled { opacity: 0.45; cursor: not-allowed; }
.ui-select__trigger > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ui-select__placeholder { color: var(--cream-dim); }
.ui-select__chev { flex: none; color: var(--gold-dim); transition: transform 0.16s var(--hud-ease), color 0.16s; }
.ui-select__trigger[aria-expanded="true"] .ui-select__chev { transform: rotate(180deg); color: var(--gold-bright); }

.ui-select__pop {
  position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 90;
  max-height: 248px; overflow-y: auto;
  background: rgba(20, 22, 26, 0.97);
  border: 1px solid var(--hair);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  padding: 4px;
  animation: pop-in 0.14s ease-out;
}
.ui-select__opt {
  position: relative;
  width: 100%; text-align: left;
  padding: 7px 12px 7px 26px;
  font-size: 13px; color: var(--cream-dim);
  transition: background 0.12s, color 0.12s;
}
.ui-select__opt:hover, .ui-select__opt.is-hi { background: rgba(201, 172, 103, 0.09); color: var(--cream); }
.ui-select__opt:disabled { opacity: 0.4; cursor: not-allowed; }
.ui-select__opt.is-active { color: var(--gold-bright); }
.ui-select__opt.is-active::before {
  content: ''; position: absolute; left: 11px; top: 50%; margin-top: -3px;
  width: 6px; height: 6px;
  background: var(--gold); transform: rotate(45deg);
  box-shadow: 0 0 6px rgba(201, 172, 103, 0.7);
}
.ui-select__opt.is-active:hover, .ui-select__opt.is-active.is-hi { background: rgba(201, 172, 103, 0.14); }

/* 行内/工具条场景：宽度收缩，不占满 */
.toolbar .ui-select-root,
.writing-editor__bar .ui-select-root { width: auto; }
.toolbar .ui-select__trigger,
.writing-editor__bar .ui-select__trigger { min-width: 150px; }

.ui-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; grid-column: span 1; }
.ui-field__label { font-size: 12px; color: var(--cream-dim); letter-spacing: 0.5px; }
.ui-field__hint { font-size: 11px; color: rgba(250, 250, 233, 0.32); }
.ui-field__error { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #ff9c9c; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
.grid2 .ui-field[style*="flex"] { grid-column: 1 / -1; }

/* ---------------- 标签 / 状态 ---------------- */
.ui-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px;
  font-size: 11.5px;
  color: var(--tag-c, rgba(250, 250, 233, 0.85));
  background: color-mix(in srgb, var(--tag-c, #ffffff) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--tag-c, #ffffff) 38%, transparent);
  white-space: nowrap;
}
.ui-tag button { display: inline-flex; opacity: 0.7; }
.ui-tag button:hover { opacity: 1; }
.ui-tag[role="button"], .ui-tag[onclick] { cursor: pointer; }

.ui-status { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--cream-dim); }
.ui-status--saved { color: var(--ok); }
.ui-status--error { color: var(--danger); }

.ui-stars { display: inline-flex; gap: 1px; }
.ui-stars__star { color: rgba(250, 250, 233, 0.22); font-size: 13px; padding: 0 1px; }
.ui-stars__star.is-on { color: var(--gold-bright); text-shadow: 0 0 10px rgba(201, 172, 103, 0.5); }

/* ---------------- HUD 面板 / 空态 ---------------- */
.glass-panel {
  position: relative;
  background-color: var(--bg-0);
  background-image:
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    radial-gradient(130% 80% at 100% 0%, rgba(201, 172, 103, 0.1), transparent 62%),
    linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);
  background-repeat: no-repeat;
  background-size: 12px 1.5px, 1.5px 12px, 12px 1.5px, 1.5px 12px, 12px 1.5px, 1.5px 12px, 12px 1.5px, 1.5px 12px, auto, auto;
  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%, 0 0, 0 0;
  border: 1px solid var(--hair);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.glass-panel::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 5px);
  pointer-events: none;
  z-index: 0;
}
.glass-panel > * { position: relative; z-index: 1; }
.glass-panel__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 12px;
  border-bottom: 1px solid rgba(201, 172, 103, 0.12);
}
.glass-panel__head h3 {
  font-size: 13.5px; font-weight: 600; letter-spacing: 2px;
  color: var(--cream);
  display: flex; align-items: center; gap: 8px;
}
.glass-panel__head h3::before {
  content: ''; width: 3px; height: 13px; background: var(--gold); flex: none;
}
.glass-panel__head .head-en { margin-left: 2px; }
.glass-panel__foot {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-top: 1px solid rgba(201, 172, 103, 0.1);
  font-size: 12px;

.ui-empty {

  -webkit-mask-image: radial-gradient(circle at center, #000 55%, transparent 78%);
  mask-image: radial-gradient(circle at center, #000 55%, transparent 78%);
  user-select: none; pointer-events: none;
}
.hero2__radar svg { position: relative; z-index: 1; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.5)); }
.hero2__attr { position: absolute; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.hero2__attr span { font-size: 12px; color: var(--cream-dim); letter-spacing: 3px; }
.hero2__attr b {
  font: 700 25px/1 var(--hud-latin);
  color: var(--gold-bright);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 18px rgba(201, 172, 103, 0.45);
}
.hero2__attr--power { top: 1%; left: 50%; transform: translateX(-50%); }
.hero2__attr--wisdom { top: 30%; right: 4%; }
.hero2__attr--charm { bottom: 16%; right: 10%; }
.hero2__attr--will { bottom: 16%; left: 10%; }
.hero2__attr--fortune { top: 30%; left: 4%; }

/* 右：大名 + 势力徽章 + 三卡行 + 2×2 */
.hero2__info { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding-top: 8px; }
.hero2__info h1 {
  font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: 6px;
  color: var(--cream);
  text-shadow: 0 0 30px rgba(201, 172, 103, 0.18);
}
.hero2__team {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 8px;
  background: var(--card); border: 1px solid var(--hair);
  font-size: 13px; color: var(--cream);
}
.hero2__team i {
  width: 24px; height: 24px;
  background: rgba(201, 172, 103, 0.12); border: 1px solid var(--gold-dim);
  color: var(--gold);
  display: inline-flex; align-items: center; justify-content: center;
}
.hero2__team em { font-style: normal; font-size: 11px; padding: 2px 8px; background: rgba(201, 172, 103, 0.14); color: var(--gold-bright); letter-spacing: 1px; }
.hero2__team:hover { border-color: var(--gold-dim); background: rgba(201, 172, 103, 0.06); }

.hero2__cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.h3card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  min-height: 104px; padding: 14px 16px;
  color: var(--cream-dim); font-size: 12px; letter-spacing: 1px;
  text-align: left;
}
.h3card svg { color: var(--gold); }
.h3card b {
  margin-top: auto;
  font: 700 30px/1 var(--hud-latin);
  color: var(--gold-bright);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 18px rgba(201, 172, 103, 0.45);
}
.h3card b small { font-size: 15px; font-weight: 600; margin-left: 2px; color: var(--gold-dim); }
/* 金底主卡：切角 + 实心自成边缘（角标隐去） */
.h3card--accent {
  background: var(--gold);
  border-color: var(--gold);
  color: rgba(20, 22, 26, 0.72);
  clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
  box-shadow: 0 14px 30px rgba(201, 172, 103, 0.25);
}
.h3card--accent::before, .h3card--accent::after { content: none; }
.h3card--accent svg { color: rgba(20, 22, 26, 0.75); }
.h3card--accent b { color: #14161a; text-shadow: none; }
.h3card--accent:hover { background: var(--gold-bright); border-color: var(--gold-bright); }
/* 亮轮廓副卡 */
.h3card--bright { background: rgba(230, 207, 149, 0.1); border-color: rgba(230, 207, 149, 0.4); color: var(--cream-dim); }
.h3card--bright b { color: var(--gold-bright); }

.hero2__grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.g4card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 13px 16px;
  color: var(--cream-dim); font-size: 12px; letter-spacing: 1.5px;
  text-align: left;
}
.g4card b {
  font: 700 21px/1 var(--hud-latin);
  color: var(--cream);
  font-variant-numeric: tabular-nums;
}

.hero2__alert {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: rgba(201, 172, 103, 0.08); border: 1px solid var(--gold-dim);
  color: var(--gold-bright); font-size: 12.5px; letter-spacing: 1px;
}
.hero2__alert i {
  font-style: normal; font-weight: 700; font-size: 12px;
  background: var(--gold); color: #14161a;
  min-width: 20px; height: 20px; padding: 0 4px;
  display: inline-flex; align-items: center; justify-content: center;
}
.hero2__alert:hover { background: rgba(201, 172, 103, 0.16); }

/* 底部两栏 */
.dash2__cols { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
.dash2-select { width: 170px; }
.dash2-select .ui-select__trigger { height: 28px; font-size: 12px; }

/* 事件统计表 */
.ev2 { display: flex; flex-direction: column; padding: 2px 12px 12px; gap: 5px; }
.ev2__row {
  display: grid; grid-template-columns: 92px 1.3fr 70px 108px 70px 40px;
  gap: 10px; align-items: center;
  padding: 10px 16px;
  border: 1px solid transparent;
  text-align: left; font-size: 12.5px; color: rgba(250, 250, 233, 0.85);
  transition: background 0.15s;
}
.ev2__row:not(.ev2__row--head):hover { background: rgba(201, 172, 103, 0.07); border-color: var(--hair); }
.ev2__row--head { background: none; color: rgba(250, 250, 233, 0.35); font-size: 11px; letter-spacing: 2px; padding-bottom: 2px; }
.ev2__name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--cream); }
.ev2__who { display: inline-flex; align-items: center; }
.ev2__who .avatar { margin-right: -7px; border: 1px solid rgba(10, 11, 13, 0.85) !important; }
.ev2__who em { font-style: normal; font-size: 11px; color: var(--cream-dim); margin-left: 10px; }
.ev2__stars { color: var(--gold-bright); font-size: 11px; letter-spacing: 1px; }
.ev2__idx { color: rgba(250, 250, 233, 0.4); font-family: var(--hud-latin); font-variant-numeric: tabular-nums; text-align: right; }

/* 章节进度卡 */
.score-tabs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.score-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  font-size: 12.5px; color: var(--cream-dim); letter-spacing: 1px;
}
.score-tab:hover { color: var(--cream); }
.score-tab.is-active { color: var(--gold-bright); font-weight: 600; }
.score-tab__dot {
  width: 7px; height: 7px;
  background: var(--gold); transform: rotate(45deg);
  box-shadow: 0 0 8px rgba(201, 172, 103, 0.7);
}
.score-tab__sep { font-style: normal; color: rgba(250, 250, 233, 0.22); margin-left: 8px; }

.score-list { display: flex; flex-direction: column; gap: 10px; padding: 4px 14px 12px; }
.score-card {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "no title num" "no badge date";
  align-items: center; column-gap: 12px; row-gap: 4px;
  padding: 14px 16px;
  text-align: left;
}
.score-card__no {
  grid-area: no; width: 40px; height: 40px;
  background: rgba(201, 172, 103, 0.1); border: 1px solid var(--gold-dim);
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 15px/1 var(--hud-latin); color: var(--gold-bright);
}
.score-card__title { grid-area: title; font-weight: 600; font-size: 13.5px; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-card__num { grid-area: num; font: 700 24px/1 var(--hud-latin); color: var(--gold-bright); font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(201, 172, 103, 0.4); }
.score-card__num small { font-size: 12px; font-weight: 600; color: var(--gold-dim); margin-left: 3px; font-family: var(--font); }
.score-badge {
  grid-area: badge; justify-self: start;
  font-size: 10.5px; font-weight: 700; padding: 2px 10px; letter-spacing: 2px;
}
.score-badge--win { background: rgba(110, 231, 160, 0.12); border: 1px solid rgba(110, 231, 160, 0.4); color: #9fe8bc; }
.score-badge--live { background: rgba(201, 172, 103, 0.16); border: 1px solid var(--gold-dim); color: var(--gold-bright); }
.score-badge--draft { background: rgba(250, 250, 233, 0.07); border: 1px solid rgba(250, 250, 233, 0.2); color: var(--cream-dim); }
.score-card__date { grid-area: date; justify-self: end; font-size: 11px; color: rgba(250, 250, 233, 0.38); font-family: var(--hud-latin); letter-spacing: 1px; }
.score-more {
  margin-top: 2px; padding: 10px;
  color: var(--cream-dim); font-size: 12.5px; letter-spacing: 2px;
  border: 1px dashed rgba(201, 172, 103, 0.3);
}
.score-more:hover { color: var(--gold-bright); background: rgba(201, 172, 103, 0.05); border-color: var(--gold-dim); }

/* ============================================================
   写作台（三栏）
   ============================================================ */
.page--writing {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr) 340px;
  gap: 14px;
  max-width: none;
  height: calc(100vh - 168px);
  min-height: 480px;
}
.writing-chapters, .writing-editor, .writing-panel {
  background-color: var(--bg-0);
  background-image: radial-gradient(130% 60% at 100% 0%, rgba(201, 172, 103, 0.07), transparent 60%);
  border: 1px solid var(--hair);
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.4);
}
.writing-chapters { display: flex; flex-direction: column; overflow: hidden; }
.writing-chapters__head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; border-bottom: 1px solid rgba(201, 172, 103, 0.12);
  font-size: 13px; font-weight: 600; color: var(--cream); letter-spacing: 1.5px;
}
.writing-chapters ul { overflow-y: auto; flex: 1; padding: 8px; }
.writing-chapters li { position: relative; margin-bottom: 4px; }
.ch-item {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px; padding-right: 76px;
  font-size: 12.5px; color: var(--cream);
  border-left: 2px solid transparent;
}
.ch-item:hover { background: rgba(201, 172, 103, 0.06); }
.ch-item.is-active { background: rgba(201, 172, 103, 0.1); border-left-color: var(--gold); }
.ch-item__title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-item__count { font-size: 10.5px; color: var(--cream-dim); font-family: var(--hud-latin); }
.ch-dot { width: 7px; height: 7px; flex-shrink: 0; transform: rotate(45deg); }
.ch-dot--done { background: var(--ok); box-shadow: 0 0 6px rgba(110, 231, 160, 0.6); }
.ch-dot--doing { background: var(--gold-bright); box-shadow: 0 0 6px rgba(201, 172, 103, 0.7); }
.ch-dot--draft { background: rgba(250, 250, 233, 0.3); }
.ch-ops {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  display: none; gap: 2px;
  background: var(--bg-1); border: 1px solid var(--hair); padding: 2px;
}
.writing-chapters li:hover .ch-ops { display: flex; }
.ch-ops button { padding: 4px; color: var(--cream-dim); display: flex; }
.ch-ops button:hover { color: var(--gold-bright); background: rgba(201, 172, 103, 0.1); }

.writing-editor {
  display: flex; flex-direction: column; min-width: 0;
  padding: 14px 18px;
}
.writing-editor__bar { display: flex; align-items: center; gap: 10px; }
.writing-editor__bar .ui-select { width: auto; flex-shrink: 0; }
.writing-editor__bar .ui-segmented { flex-shrink: 0; }
.writing-editor__title {
  flex: 1; min-width: 0; background: none; border: none; outline: none;
  color: var(--cream); font-size: 19px; font-weight: 600; letter-spacing: 2px;
  border-bottom: 1px solid transparent;
}
.writing-editor__title:focus { border-bottom-color: var(--gold-dim); }
.writing-editor__synopsis { margin-top: 10px; }
.writing-editor__synopsis .ui-input { height: 32px; font-size: 12px; }
.editor-area {
  flex: 1; margin-top: 12px; min-height: 200px;
  background: rgba(0, 0, 0, 0.25); border: 1px solid var(--hair);
  color: rgba(250, 250, 233, 0.92); font-size: 14.5px; line-height: 2;
  padding: 18px 22px; outline: none; resize: none;
}
.editor-area:focus { border-color: var(--gold-dim); }
.editor-area--preview { overflow-y: auto; }
.editor-preview { white-space: pre-wrap; }
.writing-editor__foot {
  display: flex; justify-content: space-between; gap: 12px;
  padding-top: 10px; font-size: 11.5px; color: var(--cream-dim);
}

.mention {
  padding: 1px 5px;
  color: var(--mc); background: color-mix(in srgb, var(--mc) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--mc) 40%, transparent);
  cursor: pointer;
}
.mention:hover { background: color-mix(in srgb, var(--mc) 28%, transparent); }
.mention-unknown { border-bottom: 2px dashed var(--gold-bright); cursor: pointer; padding-bottom: 1px; }
.mention-unknown:hover { background: rgba(201, 172, 103, 0.14); }

.writing-panel {
  display: flex; flex-direction: column; min-width: 0;
  padding: 12px; overflow: hidden;
}
.writing-panel__body { flex: 1; overflow-y: auto; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }

.ctx-ops { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctx-preview {
  flex: 1; min-height: 200px; max-height: calc(100vh - 320px); overflow: auto;
  background: rgba(0, 0, 0, 0.25); border: 1px solid var(--hair);
  padding: 14px; font-size: 11.5px; line-height: 1.8;
  white-space: pre-wrap; word-break: break-word;
  font-family: var(--font);
  color: rgba(250, 250, 233, 0.82);
}

/* ---------------- 卡片墙 ---------------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.char-card {
  display: flex; gap: 14px; align-items: flex-start; text-align: left;
  padding: 16px;
}
.char-card__body { min-width: 0; }
.char-card__name { font-size: 16px; font-weight: 700; color: var(--cream); letter-spacing: 1px; }
.char-card__tags { display: flex; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
.char-card__desc {
  font-size: 11.5px; color: var(--cream-dim);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.char-card__meta { margin-top: 6px; font-size: 11px; color: var(--cream-dim); }

.simple-card {
  text-align: left; padding: 16px;
  display: flex; flex-direction: column; gap: 6px;
}
.simple-card__head { display: flex; align-items: baseline; gap: 8px; }
.simple-card__name { font-size: 15px; font-weight: 700; color: var(--cream); letter-spacing: 1px; }
.simple-card__alias { font-size: 11px; color: var(--cream-dim); }
.simple-card__tags { display: flex; gap: 6px; }
.simple-card__line { font-size: 12px; color: var(--text-mid); }
.simple-card__desc {
  font-size: 11.5px; color: var(--cream-dim);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ---------------- 事件列表 ---------------- */
.ev-list { display: flex; flex-direction: column; gap: 8px; }
.ev-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px;
  text-align: left;
}
.ev-row__idx {
  width: 34px; height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 158, 122, 0.14); border: 1px solid rgba(255, 158, 122, 0.4); color: var(--entity-event);
  font: 700 13px/1 var(--hud-latin); font-variant-numeric: tabular-nums;
}
.ev-row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ev-row__name { font-weight: 600; font-size: 13.5px; color: var(--cream); letter-spacing: 1px; }
.ev-row__desc { font-size: 11.5px; color: var(--cream-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-row__avatars { display: flex; align-items: center; }

/* ---------------- 人物表单 / 详情 ---------------- */
.charform { display: grid; grid-template-columns: 160px 1fr; gap: 20px; }
.charform__side { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.charform__main { min-width: 0; }

.chardetail__head { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
.chardetail__name { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: var(--cream); flex-wrap: wrap; letter-spacing: 1px; }
.chardetail__meta { font-size: 12px; color: var(--cream-dim); margin-top: 4px; }
.chardetail__desc { font-size: 13px; color: var(--text-mid); margin-bottom: 12px; }
.chardetail__cols { display: grid; grid-template-columns: 1fr auto; gap: 18px; margin-bottom: 6px; }
.chardetail__radar { display: flex; align-items: center; }
.chardetail__kv { margin-bottom: 10px; }
.chardetail__kv h4 { font-size: 12px; color: var(--gold-dim); margin-bottom: 2px; letter-spacing: 2px; }
.chardetail__kv p { font-size: 12.5px; color: var(--cream); }
.chardetail__section { margin-top: 14px; border-top: 1px solid rgba(201, 172, 103, 0.12); padding-top: 12px; }
.chardetail__section h4 { font-size: 13px; margin-bottom: 8px; color: var(--cream); letter-spacing: 1px; }

.rel-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.rel-list li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; }
.rel-list li:hover { background: rgba(201, 172, 103, 0.06); }
.rel-list__name { font-weight: 600; font-size: 13px; color: var(--cream); text-decoration: underline; text-underline-offset: 3px; }
.rel-list__note { font-size: 11px; color: var(--cream-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-list__del { color: var(--cream-dim); display: flex; margin-left: auto; }
.rel-list__del:hover { color: var(--danger); }
.rel-list__none { color: var(--cream-dim); font-size: 12px; }
.rel-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rel-add__picker { flex: 1; min-width: 180px; }

/* ---------------- 时间线 ---------------- */
.timeline__filter { display: flex; align-items: center; gap: 8px; min-width: 260px; }
.tl { position: relative; padding-left: 8px; }
.tl__row { display: grid; grid-template-columns: 96px 24px 1fr; gap: 6px; }
.tl__time { text-align: right; padding-top: 18px; font-size: 12px; color: var(--cream-dim); font-family: var(--hud-latin); letter-spacing: 1px; }
.tl__axis { position: relative; }
.tl__axis::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 1px; background: rgba(201, 172, 103, 0.25);
}
.tl__dot {
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%) rotate(45deg);
  width: 9px; height: 9px;
  background: var(--gold); box-shadow: 0 0 10px rgba(201, 172, 103, 0.7);
}
.tl__card { margin: 8px 0; padding: 12px 16px; text-align: left; }
.tl__head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tl__name { font-weight: 600; font-size: 13.5px; color: var(--cream); letter-spacing: 1px; }
.tl__desc { font-size: 12px; color: var(--cream-dim); margin: 4px 0 8px; }
.tl__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl__who { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--cream-dim); cursor: pointer; }
.tl__who:hover { color: var(--gold-bright); }

/* ---------------- 图谱 ---------------- */
.graph-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; }
.graph-main {
  position: relative;
  background-color: var(--bg-0);
  background-image:
    linear-gradient(rgba(201, 172, 103, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201, 172, 103, 0.05) 1px, transparent 1px);
  background-size: 44px 44px;
  border: 1px solid var(--hair);
  padding: 8px; position: relative;
  overflow: hidden;
}
.graph-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; }
/* 高亮淡入淡出：悬停/选中切换透明度时不闪烁 */
.graph-canvas .rel-node,
.graph-canvas .rel-link { transition: opacity 0.18s ease; }
.graph-canvas .rel-node circle { transition: stroke 0.18s ease; }
.graph-canvas .rel-node__sel { transition: opacity 0.18s ease; }
/* 缩放控制组：画布右上角方格按钮（放大/缩小/复位） */
.graph-zoom {
  position: absolute; top: 14px; right: 14px; z-index: 6;
  display: flex; flex-direction: column; gap: 2px;
  background: rgba(20, 22, 26, 0.92);
  border: 1px solid var(--hair);
  padding: 3px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.graph-zoom button {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  color: var(--cream-dim);
  transition: all 0.15s var(--hud-ease);
}
.graph-zoom button:hover { background: rgba(201, 172, 103, 0.12); color: var(--gold-bright); }
.graph-legend {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 14px; font-size: 11.5px; color: var(--cream-dim);
  border-top: 1px solid rgba(201, 172, 103, 0.12);
}
.graph-legend .dot {
  display: inline-block; width: 8px; height: 8px; margin-right: 6px;
  transform: rotate(45deg);
}
.graph-legend__toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.rel-node__label { font-size: 12px; fill: var(--cream); paint-order: stroke; stroke: rgba(10, 11, 13, 0.85); stroke-width: 3px; }
.rel-link__label { font-size: 10.5px; fill: rgba(250, 250, 233, 0.75); display: none; paint-order: stroke; stroke: rgba(10, 11, 13, 0.85); stroke-width: 3px; }
.rel-link:hover .rel-link__label, .rel-link__label { display: none; }
.graph-canvas .rel-link:hover text { display: initial; }
.rel-link line { stroke: rgba(250, 250, 233, 0.22); }

.graph-side {
  position: relative;
  padding: 16px; min-height: 200px;
  border: 1px solid var(--hair);
  background-color: var(--bg-0);
  background-image:
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)),
    radial-gradient(130% 80% at 100% 0%, rgba(201, 172, 103, 0.1), transparent 62%),
    linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);
  background-repeat: no-repeat;
  background-size: 12px 1.5px, 1.5px 12px, 12px 1.5px, 1.5px 12px, 12px 1.5px, 1.5px 12px, 12px 1.5px, 1.5px 12px, auto, auto;
  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%, 0 0, 0 0;
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}
.graph-side::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.02) 0 1px, transparent 1px 5px);
  pointer-events: none;
}
.graph-side > * { position: relative; }
.graph-detail { display: flex; flex-direction: column; gap: 8px; }
.graph-detail h3 { font-size: 17px; color: var(--cream); letter-spacing: 1px; }
.graph-detail__tags { display: flex; gap: 6px; flex-wrap: wrap; }
.graph-detail p { font-size: 12.5px; color: var(--cream-dim); }
.graph-detail h4 { font-size: 12px; color: var(--gold-dim); margin-top: 8px; letter-spacing: 2px; }
.graph-detail ul { display: flex; flex-direction: column; gap: 4px; }
.graph-detail ul li { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
.graph-detail ul button { color: var(--cream); text-decoration: underline; text-underline-offset: 3px; }
.graph-detail ul button:hover { color: var(--gold-bright); }
.graph-detail--empty { justify-content: center; align-items: center; min-height: 160px; }

/* ---------------- 导出 ---------------- */
.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.export-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  padding: 20px;
}
.export-card h3 { font-size: 16px; color: var(--cream); letter-spacing: 2px; }
.export-card svg { color: var(--gold); }
.export-card p { font-size: 12px; color: var(--cream-dim); flex: 1; }
.check-row { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--cream-dim); cursor: pointer; }
.check-row input { accent-color: var(--gold); }

/* AI 上下文包 */
.ai-export__body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.ai-export__desc { font-size: 12.5px; line-height: 1.9; color: var(--cream-dim); }
.ai-export__desc b { color: var(--gold-bright); }
.ai-export__desc code {
  padding: 1px 6px; background: rgba(201, 172, 103, 0.1); border: 1px solid var(--gold-dim);
  color: var(--gold-bright); font-size: 12px;

.ai-export__ops { display: flex; gap: 10px; flex-wrap: wrap; }
.ai-export__target { letter-spacing: 0.5px; }
.ai-export__target::before {
  content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 8px;
  background: var(--gold); transform: rotate(45deg);
  box-shadow: 0 0 6px rgba(201, 172, 103, 0.7);
}

/* ---------------- 设置 ---------------- */
.proj-list { display: flex; flex-direction: column; }
.proj-list li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px; border-top: 1px solid rgba(201, 172, 103, 0.1);

}
.proj-list li:first-child { border-top: none; }
.proj-list li.is-active { background: rgba(201, 172, 103, 0.07); }
.proj-list li > div:first-child { display: flex; flex-direction: column; }
.proj-list__ops { display: flex; gap: 8px; }
.danger-zone { border-color: rgba(255, 107, 107, 0.35); }
.danger-zone__ops { display: flex; gap: 12px; flex-wrap: wrap; }
.audit-list button {
  background: rgba(201, 172, 103, 0.06); border: 1px solid rgba(201, 172, 103, 0.3);
  color: var(--cream);
}
.audit-list button:hover { border-color: var(--gold-dim); color: var(--gold-bright); }
