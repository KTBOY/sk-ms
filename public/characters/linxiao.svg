<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#3a3323"/>
      <stop offset="45%" stop-color="#1d1c1e"/>
      <stop offset="100%" stop-color="#121316"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf2"/>
      <stop offset="55%" stop-color="#c3cdd9"/>
      <stop offset="100%" stop-color="#8e9cb0"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b8f"/>
      <stop offset="100%" stop-color="#2a4c66"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="50%" stop-color="#b9c4cf"/>
      <stop offset="100%" stop-color="#e8eef4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6cf95"/>
      <stop offset="100%" stop-color="#c9ac67"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="800" fill="url(#bgGlow)"/>
  <g opacity=".55" fill="none" stroke="#c9ac67">
    <path d="M-20 640 L120 500 L210 590 L330 460 L440 570 L520 510 L620 620" stroke-width="1.5" opacity=".5"/>
    <path d="M-20 700 L90 600 L200 680 L340 560 L470 680 L560 620 L620 680" stroke-width="1" opacity=".35"/>
  </g>
  <g fill="#c9ac67" opacity=".5">
    <circle cx="90" cy="120" r="1.5"/><circle cx="480" cy="90" r="1.2"/>
    <circle cx="540" cy="210" r="1.4"/><circle cx="60" cy="260" r="1.2"/>
    <circle cx="150" cy="80" r="1"/><circle cx="520" cy="330" r="1"/>
  </g>
  <circle cx="300" cy="330" r="215" fill="none" stroke="#c9ac67" stroke-width="1" opacity=".18"/>
  <circle cx="300" cy="330" r="245" fill="none" stroke="#c9ac67" stroke-width=".8" opacity=".1" stroke-dasharray="3 7"/>

  <!-- 佩剑（斜背于身后） -->
  <g>
    <path d="M132 752 L468 178 L486 188 L150 762 Z" fill="url(#blade)" opacity=".95"/>
    <path d="M132 752 L150 762 L148 772 L130 762 Z" fill="#8e9cb0"/>
    <rect x="452" y="176" width="18" height="52" rx="4" transform="rotate(60 461 202)" fill="url(#gold)"/>
    <path d="M474 168 L500 158 L492 184 Z" fill="url(#gold)"/>
    <path d="M480 180 q-16 26 -8 52" fill="none" stroke="#b04a4a" stroke-width="4" opacity=".9"/>
    <path d="M476 186 q-10 20 -4 40 M484 182 q-16 26 -9 50" fill="none" stroke="#c95f5f" stroke-width="2.5" opacity=".8"/>
  </g>

  <!-- 身体：青云剑宗道袍 -->
  <g>
    <!-- 后摆 -->
    <path d="M300 300 L200 360 L150 790 L300 790 L450 790 L400 360 Z" fill="#5d7186"/>
    <!-- 主袍 -->
    <path d="M300 302 C250 310 228 330 222 352 C205 470 185 640 168 790 L432 790 C415 640 395 470 378 352 C372 330 350 310 300 302 Z" fill="url(#robe)"/>
    <!-- 交领 V 领 -->
    <path d="M300 302 L232 352 L252 470 L300 410 L348 470 L368 352 Z" fill="#f3f6f9"/>
    <path d="M300 302 L232 352 L252 470 L300 410 L348 470 L368 352 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- 右襟压左襟 -->
    <path d="M300 302 L368 352 L348 470 L300 410 Z" fill="#dfe6ee" stroke="url(#gold)" stroke-width="3"/>
    <!-- 内衬 -->
    <path d="M272 346 L300 400 L328 346 L300 330 Z" fill="#22303f"/>
    <!-- 腰带 + 玉佩 -->
    <path d="M226 512 L374 512 L366 556 L234 556 Z" fill="url(#sash)"/>
    <rect x="278" y="516" width="44" height="34" rx="3" fill="url(#gold)"/>
    <circle cx="300" cy="533" r="9" fill="#22303f"/>
    <path d="M300 556 L300 590" stroke="url(#gold)" stroke-width="3"/>
    <rect x="286" y="588" width="28" height="40" rx="6" fill="#5fae9b" stroke="url(#gold)" stroke-width="2"/>
    <!-- 袖口金线 -->
    <path d="M180 690 L420 690" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
    <path d="M172 730 L428 730" stroke="url(#gold)" stroke-width="2" opacity=".5"/>
    <!-- 宗门云纹刺绣 -->
    <g stroke="url(#gold)" stroke-width="2" fill="none" opacity=".8">
      <path d="M240 600 q12 -14 24 0 q12 14 24 0"/>
      <path d="M312 620 q12 -14 24 0 q12 14 24 0"/>
      <path d="M262 656 q12 -14 24 0 q12 14 24 0"/>
    </g>
    <!-- 剑宗徽记（左胸菱形） -->
    <rect x="246" y="392" width="16" height="16" transform="rotate(45 254 400)" fill="url(#gold)"/>
  </g>

  <!-- 头部 -->
  <g>
    <!-- 颈部 -->
    <path d="M278 288 L322 288 L322 318 L278 318 Z" fill="#e3c3a4"/>
    <!-- 脸 -->
    <path d="M300 168 C258 168 240 198 240 232 C240 268 266 300 300 300 C334 300 360 268 360 232 C360 198 342 168 300 168 Z" fill="#f0d5b8"/>
    <!-- 耳 -->
    <circle cx="242" cy="238" r="9" fill="#eccfae"/>
    <circle cx="358" cy="238" r="9" fill="#eccfae"/>
    <!-- 发 -->
    <path d="M300 150 C244 150 226 192 230 226 C236 216 246 206 252 200 C258 214 254 226 250 236 C262 216 268 200 300 196 C332 200 338 216 350 236 C346 226 342 214 348 200 C354 206 364 216 370 226 C374 192 356 150 300 150 Z" fill="#1b1d22"/>
    <!-- 发髻 + 金簪 -->
    <circle cx="300" cy="152" r="19" fill="#1b1d22"/>
    <rect x="272" y="140" width="62" height="6" rx="3" transform="rotate(-14 303 143)" fill="url(#gold)"/>
    <path d="M326 132 L340 124 L334 138 Z" fill="url(#gold)"/>
    <!-- 眉 -->
    <path d="M262 226 q16 -10 34 -4" stroke="#1b1d22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M304 222 q18 -6 34 4" stroke="#1b1d22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 眼 -->
    <path d="M264 244 q15 -8 30 0 q-15 10 -30 0 Z" fill="#fff"/>
    <circle cx="279" cy="244" r="5.5" fill="#20303c"/>
    <path d="M306 244 q15 -8 30 0 q-15 10 -30 0 Z" fill="#fff"/>
    <circle cx="321" cy="244" r="5.5" fill="#20303c"/>
    <!-- 鼻、口 -->
    <path d="M300 252 L296 270 L304 270 Z" fill="#dfba96" opacity=".8"/>
    <path d="M288 282 q12 7 24 0" stroke="#b96a5e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- HUD 四角角标 -->
  <g stroke="url(#gold)" stroke-width="2.5" fill="none">
    <path d="M18 46 L18 18 L46 18"/>
    <path d="M554 18 L582 18 L582 46"/>
    <path d="M582 754 L582 782 L554 782"/>
    <path d="M46 782 L18 782 L18 754"/>
  </g>
  <text x="300" y="776" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="26" letter-spacing="14" fill="#c9ac67">林 霄</text>
  <text x="300" y="60" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="13" letter-spacing="8" fill="#8a7c58">QING YUN SWORD SECT · 青云剑宗</text>
</svg>
