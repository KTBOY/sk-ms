<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 墨枢 NovelAtlas · 应用图标（Resonance HUD：近黑基底 / 品牌金 / 闪电Flash 同族构图语法）
       金晕 + 扫描线 + 发丝内框 + L 角标 + 点阵括号 + 辉光枢环主体 + 底部拉丁字标；
       色值取自 src/styles/tokens.css 的 bg-0 / bg-1 / gold / gold-bright -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1b1e23"/>
      <stop offset="0.62" stop-color="#14161a"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="tint" cx="1" cy="0" r="1.1">
      <stop offset="0" stop-color="#c9ac67" stop-opacity="0.14"/>
      <stop offset="0.62" stop-color="#c9ac67" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f0dcae"/>
      <stop offset="0.5" stop-color="#e6cf95"/>
      <stop offset="1" stop-color="#c9ac67"/>
    </linearGradient>
    <pattern id="scan" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="2" height="10" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#c9ac67" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#tint)"/>
  <rect width="1024" height="1024" fill="url(#scan)"/>

  <!-- 发丝内框 -->
  <rect x="57" y="57" width="910" height="910" fill="none" stroke="#c9ac67" stroke-opacity="0.22" stroke-width="3"/>

  <!-- L 形四角角标 -->
  <g fill="none" stroke="#c9ac67" stroke-width="12">
    <path d="M56 156 V56 H156"/>
    <path d="M868 56 H968 V156"/>
    <path d="M968 868 V968 H868"/>
    <path d="M156 968 H56 V868"/>
  </g>

  <!-- 菱形外框（HUD 节点母题） -->
  <path d="M512 172 L852 512 L512 852 L172 512 Z" fill="none" stroke="#c9ac67" stroke-opacity="0.28" stroke-width="4"/>

  <!-- 点阵括号 -->
  <g fill="#c9ac67" opacity="0.55">
    <rect x="120" y="432" width="8" height="8"/><rect x="120" y="446" width="8" height="8"/><rect x="120" y="460" width="8" height="8"/>
    <rect x="134" y="432" width="8" height="8"/><rect x="134" y="446" width="8" height="8"/><rect x="134" y="460" width="8" height="8"/>
    <rect x="882" y="432" width="8" height="8"/><rect x="882" y="446" width="8" height="8"/><rect x="882" y="460" width="8" height="8"/>
    <rect x="896" y="432" width="8" height="8"/><rect x="896" y="446" width="8" height="8"/><rect x="896" y="460" width="8" height="8"/>
  </g>

  <!-- 主体：亮金描边枢环 + 品牌金枢核（辉光） -->
  <g filter="url(#glow)">
    <polygon points="512,222 802,512 512,802 222,512" fill="none" stroke="#e6cf95" stroke-width="18"/>
    <polygon points="512,322 702,512 512,702 322,512" fill="url(#core)"/>
  </g>

  <!-- 底部拉丁标 -->
  <text x="524" y="928" text-anchor="middle" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', sans-serif" font-size="52" letter-spacing="24" fill="#c9ac67" fill-opacity="0.6">NOVELATLAS</text>
</svg>
