<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 墨枢 NovelAtlas · 16px 专用：只保留品牌金实心菱形，确保任务栏最小尺寸清晰可辨 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#1b1e23"/>
      <stop offset="0.62" stop-color="#14161a"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cf95"/>
      <stop offset="1" stop-color="#c9ac67"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <polygon points="512,262 762,512 512,762 262,512" fill="#c9ac67" opacity="0.55" filter="url(#glow)"/>
  <polygon points="512,262 762,512 512,762 262,512" fill="url(#core)"/>
</svg>
